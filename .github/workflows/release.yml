name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      latest_version: ${{ steps.version.outputs.latest_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check release version
        id: version
        run: node scripts/check-release-version.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  validate:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test --reporter=verbose

      - name: Validate changelog release notes
        run: node scripts/extract-changelog-release-notes.mjs --check

      - name: Build renderer and main bundles
        run: yarn build

  build:
    needs:
      - check-version
      - validate
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            builder_target: mac
          - os: windows-latest
            platform: windows
            builder_target: win
          - os: ubuntu-latest
            platform: linux
            builder_target: linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build renderer and main bundles
        run: yarn build

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Package ${{ matrix.platform }}
        run: yarn electron-builder --${{ matrix.builder_target }} --publish never
        env:
          DEBUG: electron-builder

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.yml
            release/*.yaml
            release/*.blockmap

  publish:
    needs:
      - check-version
      - build
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts

      - name: Generate release notes
        run: node scripts/extract-changelog-release-notes.mjs --output release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check-version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.check-version.outputs.version }}
        shell: bash
        run: |
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md

  prepare-next-dev-version:
    needs:
      - check-version
      - publish
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify dev branch exists
        shell: bash
        run: |
          if ! git ls-remote --exit-code --heads origin dev >/dev/null; then
            echo "Development branch 'dev' does not exist; create it before running release." >&2
            exit 1
          fi

      - name: Checkout dev
        shell: bash
        run: |
          git fetch origin dev:refs/remotes/origin/dev
          git checkout -B dev origin/dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare next dev version
        id: next-version
        run: |
          node scripts/prepare-next-dev-version.mjs \
            --released-version "$RELEASED_VERSION" \
            --release-date "$(date -u +%F)"
        env:
          RELEASED_VERSION: ${{ needs.check-version.outputs.version }}

      - name: Commit next dev version
        if: steps.next-version.outputs.changed == 'true'
        env:
          NEXT_VERSION: ${{ steps.next-version.outputs.next_version }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No dev version changes to commit"
            exit 0
          fi
          git commit -m "chore(release): prepare v$NEXT_VERSION [skip release] [skip ci]"
          git push origin HEAD:dev
